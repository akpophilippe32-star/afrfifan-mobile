name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      # ✅ MODIFIÉ : Utilisation des secrets GitHub pour injecter tes vraies clés
      - name: Create .env from GitHub Secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      # ✅ MODIFIÉ : Génère des APK séparés par processeur (beaucoup plus légers)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # ✅ MODIFIÉ : Upload tous les petits APK générés dans un seul dossier
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: afrifan-release-apks
          path: build/app/outputs/flutter-apk/*.apk