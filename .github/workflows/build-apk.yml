name: Build Flutter APK

# Déclenche l'action à chaque push sur la branche 'main' ou manuellement
on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest # Utilise un serveur Linux puissant de GitHub

    steps:
      # 1. Récupérer ton code depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Flutter sur le serveur
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0' # Version stable récente

      # 3. Installer les dépendances du projet
      - name: Install dependencies
        run: flutter pub get

      # 4. Construire l'APK en mode release (optimisé)
      - name: Build APK
        run: flutter build apk --release

      # 5. Sauvegarder l'APK pour que tu puisses le télécharger
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: afrifan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk