name: afrifan
description: "Afrifan - Soutenez vos créateurs. Vivez l'Afrique."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  device_preview: ^1.2.0
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  share_plus: ^12.0.2
  file_picker: ^8.1.2
  just_audio: ^0.9.36
  carousel_slider: ^5.0.0
  permission_handler: ^11.3.1
  fl_chart: ^0.69.0
  agora_rtc_engine: ^6.3.2
  record: ^5.2.0
  path_provider: ^2.1.2
  agora_token_generator: ^0.0.2
  video_player: ^2.9.1
  camera: ^0.10.5
  http: ^1.1.0
  audioplayers: ^6.0.0
  
  hive: ^2.2.3                  
  hive_flutter: ^1.1.0          
  connectivity_plus: ^6.0.5     
  flutter_cache_manager: ^3.4.1 

  ffmpeg_kit_flutter: ^6.0.3   
  video_compress: ^3.1.1       
  flutter_pdfview: ^1.4.5
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env